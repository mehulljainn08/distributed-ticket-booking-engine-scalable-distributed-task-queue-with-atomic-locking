worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # ── Docker DNS resolver for dynamic service discovery ──
    # 127.0.0.11 is Docker's embedded DNS server.
    # valid=5s means Nginx re-resolves the DNS every 5 seconds,
    # picking up new/removed api-gateway containers automatically.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Logging ──
    log_format main '$remote_addr - $request - $status - ${request_time}s';
    access_log /var/log/nginx/access.log main;

    # ── Connection tuning ──
    keepalive_timeout 65;
    keepalive_requests 1000;

    server {
        listen 80;

        location / {
            # Using a variable forces Nginx to re-resolve DNS on every request
            # instead of caching a single IP at startup.
            # Docker DNS round-robins across all scaled api-gateway instances.
            set $backend http://api-gateway:3000;
            proxy_pass $backend;

            # ── Headers ──
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── Timeouts ──
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # ── Buffering ──
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # ── Health check endpoint for the LB itself ──
        location /nginx-health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
