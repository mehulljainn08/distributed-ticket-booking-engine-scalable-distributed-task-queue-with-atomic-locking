global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']

  - job_name: 'worker-node'
    static_configs:
      - targets: ['worker-node:5000']

  - job_name: 'database-webhook-node'
    static_configs:
      - targets: ['database-webhook-node:4000']
